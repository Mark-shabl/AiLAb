# AI Lab — стек обучения + инференс (GPU)
# Запуск из каталога gpu/: docker compose --profile inference up -d
# Общие данные: ../data  |  скрипты: ../scripts

services:
  llama-factory:
    image: hiyouga/llamafactory:latest
    container_name: ailab-llama-factory
    ipc: host
    tty: true
    stdin_open: true
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    ports:
      - "${LF_PORT_UI:-7860}:7860"
      - "${LF_PORT_API:-8000}:8000"
    volumes:
      - ../data/models:/app/models
      - ../data/datasets:/app/data
      - ../data/output:/app/output
      - ../data/hf_cache:/root/.cache/huggingface
      - ../data/logs/tb:/app/output/tensorboard
      - ../scripts:/app/scripts
    environment:
      - GRADIO_SERVER_NAME=0.0.0.0
      - GRADIO_SERVER_PORT=7860
      - HF_HOME=/root/.cache/huggingface
      - HF_TOKEN=${HF_TOKEN:-}
      - CUDA_VISIBLE_DEVICES=${CUDA_VISIBLE_DEVICES:-all}
    restart: unless-stopped
    networks:
      - ailab

  tensorboard:
    build:
      context: ../docker/tensorboard
      dockerfile: Dockerfile
    container_name: ailab-tensorboard
    ports:
      - "${TB_PORT:-6006}:6006"
    volumes:
      - ../data/logs/tb:/logs:ro
      - ../data/output:/output:ro
    command: >
      tensorboard
        --logdir=/logs
        --host=0.0.0.0
        --port=6006
        --reload_multifile=true
    restart: unless-stopped
    networks:
      - ailab

  aim:
    image: aimstack/aim:latest
    container_name: ailab-aim
    ports:
      - "${AIM_PORT_UI:-43800}:43800"
      - "${AIM_PORT_TRACKING:-53800}:53800"
    volumes:
      - ../data/logs/aim:/opt/aim
    command: up --host 0.0.0.0 --port 43800 --repo /opt/aim
    restart: unless-stopped
    networks:
      - ailab

  jupyter:
    image: quay.io/jupyter/pytorch-notebook:cuda12-latest
    container_name: ailab-jupyter
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    ports:
      - "${JUPYTER_PORT:-8888}:8888"
    volumes:
      - ../data/models:/home/jovyan/models
      - ../data/datasets:/home/jovyan/data
      - ../data/output:/home/jovyan/output
      - ../data/notebooks:/home/jovyan/work
      - ../data/logs:/home/jovyan/logs
      - ../data/hf_cache:/home/jovyan/.cache/huggingface
      - ../scripts:/home/jovyan/scripts
    environment:
      - JUPYTER_ENABLE_LAB=yes
      - GRANT_SUDO=yes
      - HF_HOME=/home/jovyan/.cache/huggingface
      - HF_TOKEN=${HF_TOKEN:-}
    command: >
      start-notebook.sh
        --NotebookApp.token=''
        --NotebookApp.password=''
        --ServerApp.disable_check_xsrf=True
    restart: unless-stopped
    networks:
      - ailab

  ollama:
    image: ollama/ollama:latest
    container_name: ailab-ollama
    profiles:
      - inference
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    ports:
      - "${OLLAMA_PORT:-11434}:11434"
    volumes:
      - ../data/ollama:/root/.ollama
      - ../data/models:/models:ro
    restart: unless-stopped
    networks:
      - ailab

networks:
  ailab:
    name: ailab
    driver: bridge
